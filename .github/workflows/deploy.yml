# .github/workflows/deploy.yml
name: Build, Test & Sync to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10" # Disesuaikan dengan Dockerfile-mu (3.10)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx
          pip install -r requirements.txt

      - name: Lint & check for errors (Ruff)
        run: |
          # Hanya mengecek error fatal (Sintaks error, variabel tak terdefinisi)
          # Mengabaikan aturan gaya penulisan agar build tidak mudah gagal
          ruff check . --select E,F --ignore E501

      - name: Build Docker Image (Local Test)
        run: docker build -t hf-space-app .

  sync-to-hf:
    runs-on: ubuntu-latest
    needs: build-and-test 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: |
          # Setup kredensial Git agar bisa push ke Hugging Face
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions Bot"
          
          # Menambahkan Hugging Face sebagai remote repository
          git remote add space https://NaufalSyahputra:$HF_TOKEN@huggingface.co/spaces/$HF_REPO_ID
          
          # Push paksa kode dari branch main GitHub ke branch main Hugging Face
          git push --force space main:main